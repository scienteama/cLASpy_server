[project]
name = "claspy-server"
version = "0.1.0"
description = "cLASpy_T Web API Server"
authors = [
    {name = "HelcAraX3",email = "valentin.gautier@scienteama.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "bidict (>=0.23.1,<0.24.0)",
    "databases (>=0.9.0,<0.10.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "fastapi (>=0.136.1,<0.137.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "kombu (>=5.6.2,<6.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "pwdlib[argon2] (>=0.3.0,<0.4.0)",
    "pyjwt (>=2.12.1,<3.0.0)",
    "pydantic (>=2.13.3,<3.0.0)",
    "pydantic-settings (>=2.14.0,<3.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "python-engineio (>=4.13.1,<5.0.0)",
    "python-multipart (>=0.0.27,<0.0.28)",
    "python-socketio (>=5.16.1,<6.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.33.1,<3.0.0)",
    "scikit-learn (>=1.8.0,<2.0.0)",
    "simple-websocket (>=1.1.0,<2.0.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "starlette (>=1.0.0,<2.0.0)",
    "tzdata (>=2026.2,<2027.0)",
    "uvicorn (>=0.46.0,<0.47.0)",
    "wsproto (>=1.3.2,<2.0.0)",
]
[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "colorclass (>=2.2.2,<3.0.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "terminaltables (>=3.1.10,<4.0.0)",
    "typing-extensions (>=4.15.0,<5.0.0)",
    "typing-inspection (>=0.4.2,<0.5.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
exclude = [
    "db/migrations",
    "**/migrations",
    "alembic/versions",
]

[tool.ruff.lint.per-file-ignores]
"app/database.py" = ["E402"]
"db/migrations/env.py" = ["E402", "F403"]
"db/seed.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
(
    /db/seed\.py$
  | /app/database\.py$
  | /db/docker-compose\.db\.yml$
  | /db/migrations/
  | /alembic/
)
'''

